<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Fitness Challenge and Leaderboard App </title>
    <!-- Include Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Include CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1> Fitness Challenge and Leaderboard App </h1>
            <p class="subtitle">Global Challenge Dashboard</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('leaderboard')">Leaderboard</button>
            <button class="tab-btn" onclick="switchTab('challenges')">Challenges</button>
            <button class="tab-btn" onclick="switchTab('workout-logs')">Workout Logs</button>
        </div>

        <!-- Leaderboard Section -->
        <section id="leaderboard" class="tab-content active">
            <div class="leaderboard-header">
                <div>Rank</div>
                <div>Participant</div>
                <div style="text-align: right;">Points</div>
            </div>
            <ul class="leaderboard-list" id="leaderboard-list">
                <!-- JavaScript will populate this -->
            </ul>
            <div class="controls">
                <button class="action-btn" onclick="simulateActivity()">Simulate Live Activity</button>
            </div>
        </section>

        <!-- Challenges Section -->
        <section id="challenges" class="tab-content">
            <div class="challenges-grid" id="challenges-list">
                <!-- JavaScript will populate this -->
            </div>
        </section>

        <!-- Workout Logs Section -->
        <section id="workout-logs" class="tab-content">
            <div class="log-form-card">
                <h3>Log New Workout</h3>
                <form id="workout-form" onsubmit="submitWorkout(event)">
                    <div class="form-group">
                        <label for="workout-type">Workout Type</label>
                        <select id="workout-type" required>
                            <option value="Running">Running</option>
                            <option value="Cycling">Cycling</option>
                            <option value="Yoga">Yoga</option>
                            <option value="Weightlifting">Weightlifting</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (mins)</label>
                        <input type="number" id="duration" min="1" required placeholder="e.g., 30">
                    </div>
                    <button type="submit" class="action-btn">Log Workout</button>
                </form>
            </div>

            <div class="logs-history">
                <h3>Recent Logs</h3>
                <ul class="history-list" id="history-list">
                    <!-- JavaScript will populate this -->
                </ul>
            </div>
        </section>

    </div>

    <!-- Include JavaScript File -->
    <script src="script.js"></script>
</body>

</html>
